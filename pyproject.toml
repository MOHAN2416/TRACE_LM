[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "trace_lm"
version = "0.1.0"
description = "TRACE-LM: Trajectory Anomaly Checkpoint & Evaluation in LLMs"
authors = [{name = "TRACE-LM Team"}]
dependencies = [
    "torch",
    "transformers",
    "scikit-learn",
    "pandas",
    "streamlit",
    "joblib",
    "matplotlib",
    "requests",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
